
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Recipe Book</title>

        <!-- Google Font -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="../styles/recipes.css">

        <!-- Open Graph -->
        <meta property="og:type" content="website">
        <meta property="og:title" content="Recipe Book">
        <meta property="og:description" content="Browse delicious recipes including desserts, meals, and snacks.">
        <meta property="og:url" content="https://yourwebsite.com">
        <meta property="og:image" content="social-preview-image.png">

        <!-- X Card -->
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="Recipe Book">
        <meta name="twitter:description" content="Browse delicious recipes including desserts, meals, and snacks.">
        <meta name="twitter:image" content="social-preview-image.png">

        <!-- Apple Touch Icon -->
        <link rel="apple-touch-icon" href="../images/apple-touch-icon.png">

        <!-- JavaScript -->
        <script src="./recipes.js" defer></script>
    </head>

    <body>

        <header>
            <div class="logo">
                <img src="../images/recipe-book-icon.png" alt="Recipe Book Logo">
                <h1>RecipeBook</h1>
            </div>
        </header>

        <main>

            <!-- Recipe Search -->
            <form class="search-bar" id="search-form" role="search">
                <input
                    type="search"
                    id="search-input"
                    placeholder="Find a recipe"
                    aria-label="Search recipes"
                >

                <button type="submit" aria-label="Search">
                    <img src="../images/search.svg" alt="">
                </button>
            </form>

            <!-- Recipes are displayed here by JavaScript -->
            <section
                class="recipe-list"
                id="recipe-container"
                aria-label="Recipes"
                aria-live="polite"
            >
            </section>

        </main>

        <footer>

            <a
                href="https://www.flaticon.com/free-icons/recipe"
                title="recipe icons"
            >
                Recipe icons created by Freepik - Flaticon
            </a>

            <div class="social">
                <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates -->
                <a href="#" aria-label="Instagram">
                    <img src="../images/instagram_icon.svg" alt="">
                </a>

                <a href="#" aria-label="YouTube">
                    <img src="../images/youtube_icon.svg" alt="">
                </a>

                <a href="#" aria-label="Pinterest">
                    <img src="../images/pinterest_icon.svg" alt="">
                </a>
            </div>

        </footer>

    </body>
</html>
