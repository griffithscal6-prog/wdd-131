<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ponder - JS Variables and Constants</title>

    <!-- Link to your CSS file -->
    <link rel="stylesheet" href="styles/js-variables.css">

    <script>
        //JavaScript Land

        // let the keyword for a variable
        /*
        multiline comment
        works for blocks of comments
        */ 
        const PI = 3.14;
        let radius = 3;

        let area = radius**2 * PI;

        //this works like print in Python
        console.log("The area of a circle with a radius of 3 is " + area);

        radius = 20;
        area = radius**2 * PI;
        console.log("The area of a circle with a radius of 20 is " + area);

        //type coercion
        //Constant means the variable CANNOT change after the fact
        const one = 1;
        const two = '2';

        let product = one * two; 
        console.log("The product of 1 and '2' is " + product);

        let sum = one + Number(two);
        console.log("The sum of 1 and '2' is " + sum);

        //scope
        let course = "CSE131"; //global scope
        if (true) {
            let student = "John";
            console.log(course);  //works just fine, course is global
            console.log(student); //works just fine, it's being accessed within the block
        }
        console.log(course); //works fine, course is global
        console.log(student); //does not work, can't access a block variable outside the block

    </script>
</head>
